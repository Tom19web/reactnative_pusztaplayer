services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pusztaplayer
      POSTGRES_USER: puszta
      POSTGRES_PASSWORD: ${DB_PASSWORD:-puszta_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - puszta_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puszta -d pusztaplayer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - puszta_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://puszta:${DB_PASSWORD:-puszta_secret}@postgres:5432/pusztaplayer
      REDIS_URL: redis://redis:6379/0
      SERVER_DOMAIN: live.pusztaplay.eu
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      TMDB_API_KEY: ${TMDB_API_KEY}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY}
      XTREAM_API_BASE: ${XTREAM_API_BASE:-https://live.pusztaplay.eu}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-/run/secrets/fcm_credentials}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - puszta_internal
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./static/logos:/app/static/logos


volumes:
  pgdata:

networks:
  puszta_internal:
    driver: bridge