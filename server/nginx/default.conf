resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name live.pusztaplay.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name live.pusztaplay.eu;

    ssl_certificate /etc/letsencrypt/live/live.pusztaplay.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.pusztaplay.eu/privkey.pem;
    ssl_protocols TLSv1.3;

    gzip on;
    gzip_types application/json text/plain text/css image/svg+xml;

    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        add_header Access-Control-Allow-Origin *;
    }

    location /logos/ {
        alias /opt/pusztaplayer/static/logos/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    location /api/ {
        set $upstream fastapi:8000;
        proxy_pass http://$upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        set $upstream fastapi:8000;
        proxy_pass http://$upstream/;
        proxy_set_header Host $host;
    }
}